# LastGate 내부 서버 MQTT 브로커 설정
#   1883 : 서버 · FMS(로봇 시뮬레이터) · 테스트 도구 (TCP)
#   9001 : 웹 키오스크 (WebSocket, 브라우저는 TCP MQTT 를 쓸 수 없음)
# 실행: mosquitto -c broker/mosquitto.conf -v

listener 1883
protocol mqtt

listener 9001
protocol websockets

# 시연용 내부망 설정. 운영 시에는 계정/ACL 과 TLS(wss) 를 설정할 것
allow_anonymous true
persistence false
