<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c3b">
  <title>LastGate | 스마트 택배 키오스크</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
/* LastGate touch kiosk: compact horizontal progress, no promotional sidebar. */
body.kiosk-page{background:#f5f8f9}
.kiosk-page .kiosk-shell{display:block;min-height:100vh;min-height:100dvh;background:#f5f8f9}
.kiosk-page .kiosk-main{min-height:100vh;min-height:100dvh;background:#f5f8f9}
.kiosk-page .topbar{min-height:86px;background:#102e40;color:#c4e3e6;border:0;padding:17px clamp(24px,5vw,76px);gap:20px;box-shadow:0 3px 18px rgba(19,45,59,.06)}
.kiosk-page .topbar .brand{color:#fff;gap:12px}
.kiosk-page .topbar .brand-icon{width:45px;height:45px;border-color:#68d9b4;color:#76ebc6}
.kiosk-page .topbar .brand strong{font-size:26px;letter-spacing:-1.1px}
.kiosk-page .topbar .brand small{font-size:11px;letter-spacing:.2px;color:#91bac1;font-weight:600;margin-top:3px}
.kiosk-page .topbar-right{font-size:12px;letter-spacing:0;gap:10px;color:#c3dce0}
.kiosk-live-dot{height:8px;width:8px;display:inline-block;border-radius:50%;background:#56e2b0;box-shadow:0 0 0 4px rgba(86,226,176,.15)}
.kiosk-page .topbar .divider-dot{color:#668a97}
.kiosk-page .kiosk-station{margin-left:12px;border:1px solid #456476;padding:8px 11px;border-radius:8px;font-size:11px;color:#a5c9d0}
.stepper-bar{background:#fff;border-bottom:1px solid #e6edef}
.stepper-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:26px;padding:16px clamp(20px,4vw,40px)}
.kiosk-page .side-steps{display:flex;align-items:center;justify-content:center;flex:1;margin:0;padding:0;gap:clamp(12px,3vw,42px)}
.kiosk-page .side-step{display:flex;align-items:center;gap:9px;margin:0;padding:0;background:transparent;border:0;opacity:1;color:#8b9eaa;border-radius:0;white-space:nowrap}
.kiosk-page .side-step strong{font-size:13px;color:#8a9ca6;font-weight:700}
.kiosk-page .side-step small{display:none}
.kiosk-page .side-step-number{width:30px;height:30px;font-size:12px;border-radius:50%;background:#f1f5f6;border-color:#dae4e7;color:#839aa4}
.kiosk-page .side-step-number svg{width:17px;height:17px}
.kiosk-page .side-step-active strong{color:#126e5c}
.kiosk-page .side-step-active .side-step-number{background:#21b58f;border-color:#21b58f;color:#fff;box-shadow:0 0 0 4px #e6f8f1}
.kiosk-page .side-step-done strong{color:#447d72}
.kiosk-page .side-step-done .side-step-number{background:#e5f9ef;border-color:#afe5cf;color:#139d79}
.kiosk-page .stepper-count{color:#79909b;font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap;border-left:1px solid #e1eaec;padding-left:22px}
.kiosk-page .kiosk-content{width:100%;max-width:850px;margin:auto;padding:30px clamp(18px,4vw,48px);justify-content:center;flex:1}
.kiosk-form-surface{background:#fff;border:1px solid #e5ecef;border-radius:20px;padding:clamp(24px,4vw,48px);box-shadow:0 16px 46px rgba(30,62,77,.05);width:100%}
.kiosk-page .eyebrow{font-size:10px;margin:0;color:#209a78}
.kiosk-page .kiosk-content h1{font-size:clamp(27px,3.4vw,40px);margin:18px 0 8px}
.kiosk-page .page-lead{margin-bottom:28px}
.kiosk-page .building-card{height:96px;min-height:76px}
.kiosk-page .size-card{height:148px}
.kiosk-page .unit-field input{height:66px}
.kiosk-page .kiosk-footer{background:#fff;max-width:none;border-top:1px solid #e5ecf0;padding:18px clamp(24px,5vw,76px);min-height:94px;gap:18px}
.kiosk-page .footer-disclaimer{max-width:440px;font-size:11px}
.kiosk-page .btn{min-height:54px;font-size:15px;padding:16px 28px;border-radius:12px}
.kiosk-page .receipt-card{max-width:620px}
.intake-start-stage{text-align:center;padding:clamp(16px,4vw,42px) 0 12px}.intake-start-icon{width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#e4f9f1,#f7fffc);color:#159b78;display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 14px 34px rgba(25,160,125,.12)}.intake-start-icon svg{width:52px;height:52px}.intake-start-stage h1{margin-top:15px!important}.intake-start-guide{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:30px 0 28px}.intake-start-guide span{border:1px solid #e0eaec;background:#f8fbfb;border-radius:12px;padding:13px 9px;color:#657e89;font-size:11px;font-weight:700}.intake-start-guide b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e1f6ee;color:#15876c;margin-right:5px;font-size:10px}.intake-start-button{width:min(100%,420px);min-height:68px!important;font-size:19px!important;justify-content:center;box-shadow:0 13px 28px rgba(20,153,118,.2)}
/* Touch and small-screen behavior: no sidebar, wrapping steps, full-width action buttons. */
@media(max-width:720px){
  .kiosk-page .kiosk-main{min-height:100dvh}
  .kiosk-page .topbar{min-height:74px;padding:14px 20px}
  .kiosk-page .topbar .brand-icon{width:38px;height:38px}
  .kiosk-page .topbar .brand strong{font-size:23px}
  .kiosk-page .topbar .brand small{font-size:9px}
  .kiosk-page .topbar-right{font-size:11px}
  .kiosk-page .topbar .divider-dot,.kiosk-page .kiosk-station,#local-clock{display:none}
  .stepper-inner{padding:14px 12px;gap:9px}
  .kiosk-page .side-steps{gap:10px;justify-content:space-around}
  .kiosk-page .side-step{gap:6px}
  .kiosk-page .side-step-number{width:25px;height:25px;font-size:10px}
  .kiosk-page .side-step strong{font-size:11px}
  .kiosk-page .stepper-count{font-size:9px;padding-left:9px}
  .kiosk-page .kiosk-content{padding:20px 14px;justify-content:flex-start}
  .kiosk-form-surface{padding:24px 18px;border-radius:16px}
  .kiosk-page .kiosk-content h1{font-size:29px}
  .kiosk-page .kiosk-footer{padding:14px 18px;flex-direction:column-reverse;align-items:stretch;gap:10px}
  .kiosk-page .footer-actions{display:grid;grid-template-columns:1fr 1.35fr}
  .kiosk-page .btn{padding:13px 12px;font-size:14px}
  .kiosk-page .footer-disclaimer{font-size:10px;max-width:none}
  .intake-start-stage{padding:10px 0}.intake-start-icon{width:74px;height:74px;border-radius:21px;margin-bottom:18px}.intake-start-icon svg{width:42px;height:42px}.intake-start-guide{grid-template-columns:1fr;margin:22px 0 20px}.intake-start-button{min-height:60px!important;font-size:17px!important}
}
@media(max-width:395px){
  .kiosk-page .side-step strong{font-size:10px}
  .kiosk-page .side-steps{gap:5px}
  .kiosk-page .stepper-count{display:none}
  .kiosk-page .building-card{height:77px}
  .kiosk-page .size-card{height:132px}
}
@media(min-width:900px) and (min-height:900px){
  .kiosk-page .kiosk-content{max-width:940px}
  .kiosk-form-surface{padding:52px 62px}
  .kiosk-page .building-card{height:113px}
}

  </style>
  <script type="module" src="/assets/kiosk.js"></script>
</head>
<body class="kiosk-page">
  <div class="kiosk-shell">
    <main class="kiosk-main">
      <!-- 키오스크는 소개용 사이드바 없이, 한 번에 한 작업을 처리합니다. -->
      <header class="topbar">
        <a class="brand" href="/" aria-label="LastGate 택배 접수 홈">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none"><path d="M20 4 35 12v16L20 36 5 28V12L20 4Z" stroke="currentColor" stroke-width="2.8"/><path d="M5.5 12 20 20l14.5-8M20 20v15" stroke="currentColor" stroke-width="2.6"/><path d="m13 8 15 8" stroke="currentColor" stroke-width="2.6"/></svg>
          </span>
          <span><strong>LastGate</strong><small>스마트 택배 키오스크</small></span>
        </a>
        <div class="topbar-right">
          <span class="kiosk-live-dot" aria-hidden="true"></span>
          <span>공동 택배 접수처</span>
          <span class="divider-dot" aria-hidden="true">·</span>
          <span id="local-clock"></span>
          <span class="kiosk-station">키오스크 01</span>
        </div>
      </header>

      <!-- 기존 왼쪽 단계 목록을 상단의 작은 가로 단계 표시로 이동 -->
      <nav class="stepper-bar" id="stepper-bar" aria-label="진행 상태" hidden>
        <div class="stepper-inner">
          <div class="side-steps" id="side-steps" aria-label="접수 진행 단계"></div>
          <span class="stepper-count" id="progress-text" aria-live="polite">STEP 01 / 03</span>
        </div>
      </nav>

      <section class="kiosk-content">
        <div class="kiosk-form-surface">
          <div class="eyebrow"><span class="eyebrow-line"></span> <span id="kiosk-eyebrow">LASTGATE KIOSK</span></div>
          <div id="step-content" aria-live="polite"></div>
          <div id="kiosk-alert" class="alert-banner" role="alert" hidden></div>
        </div>
      </section>

      <footer class="kiosk-footer">
        <div class="footer-disclaimer"><span aria-hidden="true">ⓘ</span> <span>메이커톤 시연용 · 실제 택배사/로봇/컨베이어 장비와 연동되지 않습니다.</span></div>
        <div class="footer-actions" id="footer-actions"></div>
      </footer>
    </main>
  </div>
</body>
</html>
